<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishGuard AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="w-popup bg-navy text-slate-200">
  <!-- Header -->
  <header class="flex items-center justify-between px-4 py-3 border-b bg-card">
    <div class="flex items-center gap-2">
      <img src="icons/icon48.png" alt="PhishGuard AI" class="w-8 h-8 rounded-lg" />
      <div>
        <div class="flex items-center gap-1.5">
          <span class="font-bold text-sm text-white">PhishGuard AI</span>
          <span class="badge bg-blue-500/15 text-blue-300 border border-blue-500/30">Live</span>
        </div>
        <p class="text-xs text-slate-400" style="margin:0;">Check messages before you click</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5" title="Local protection status">
      <span id="api-dot" class="w-2 h-2 rounded-full bg-amber-500"></span>
      <span id="api-status-text" class="text-xs text-slate-400 font-mono">checking</span>
    </div>
  </header>

  <main class="p-4 flex flex-col gap-3">
    <!-- Quick Actions Row -->
    <div class="flex items-center justify-between gap-2">
      <button id="capture-btn" type="button" class="btn btn-ghost px-2.5 py-1.5 text-xs flex-1">
        Grab Page Text
      </button>
      <button id="dashboard-btn" type="button" class="btn btn-ghost px-2.5 py-1.5 text-xs">
        History
      </button>
      <button id="console-btn" type="button" class="btn btn-ghost px-2.5 py-1.5 text-xs">
        Full App
      </button>
    </div>

    <!-- On-Page Color Alerts Toggle -->
    <div class="flex items-center justify-between px-3 py-2 rounded-lg bg-card border">
      <div>
        <div class="text-xs font-semibold text-white">Auto-Warn on Pages</div>
        <div class="text-xs text-slate-400">Show red/amber banners on risky messages</div>
      </div>
      <button id="alerts-toggle" type="button" class="toggle-pill active" aria-label="Toggle on-page alerts"></button>
    </div>

    <!-- Input Box -->
    <div>
      <div class="flex items-center justify-between mb-1">
        <label for="message-input" class="text-xs font-semibold uppercase tracking-wider text-slate-400">
          Paste or Grab a Message
        </label>
        <div class="flex items-center gap-1.5">
          <button id="sample-phish-btn" type="button" class="btn btn-ghost px-2 py-1 text-xs">Try Scam</button>
          <button id="sample-safe-btn" type="button" class="btn btn-ghost px-2 py-1 text-xs">Try Safe</button>
          <button id="clear-btn" type="button" class="btn btn-ghost px-2 py-1 text-xs">Clear</button>
        </div>
      </div>
      <textarea
        id="message-input"
        class="pg-input"
        placeholder="Paste an email, LinkedIn message, or Slack DM here — or click 'Grab Page Text' above..."
      ></textarea>
    </div>

    <!-- Primary Scan Button -->
    <button id="scan-btn" type="button" class="btn btn-primary w-full py-2.5 text-sm">
      Check If This Is Safe
    </button>

    <!-- Error Banner -->
    <div id="error-box" class="hidden p-2.5 rounded-lg bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs leading-relaxed"></div>

    <!-- Result Panel -->
    <section id="result-panel" class="hidden p-3 rounded-xl bg-card border flex flex-col gap-2.5">
      <div class="flex items-center justify-between">
        <div>
          <span id="verdict-headline" class="text-sm font-bold text-white">--</span>
          <div class="flex items-baseline gap-1.5 mt-1">
            <span id="risk-score" class="text-2xl font-bold text-white">--</span>
            <span class="text-xs text-slate-400">/ 100 risk</span>
          </div>
        </div>
        <div class="text-right">
          <span id="verdict-badge" class="badge bg-slate-800 text-slate-200">--</span>
          <div id="attack-vector" class="text-xs font-semibold text-blue-300 mt-1"></div>
        </div>
      </div>

      <div class="progress-track">
        <div id="risk-bar" class="progress-fill bg-blue-600" style="width: 0%;"></div>
      </div>

      <div id="recommended-action" class="signal-chip border border-blue-500/30 bg-blue-500/15 text-blue-200"></div>

      <!-- Category Breakdown -->
      <div id="breakdown-row" class="hidden grid grid-cols-3 gap-2">
        <div class="signal-chip text-center">
          <div class="text-xs text-slate-400">Pressure</div>
          <div id="score-heuristics" class="text-sm font-bold text-white mt-1">0</div>
        </div>
        <div class="signal-chip text-center">
          <div class="text-xs text-slate-400">Links/OTP</div>
          <div id="score-regex" class="text-sm font-bold text-white mt-1">0</div>
        </div>
        <div class="signal-chip text-center">
          <div class="text-xs text-slate-400">AI Tone</div>
          <div id="score-semantic" class="text-sm font-bold text-white mt-1">0</div>
        </div>
      </div>

      <!-- Inspected Links -->
      <div id="links-section" class="hidden">
        <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Links Checked</div>
        <div id="links-list" class="flex flex-col gap-1.5"></div>
      </div>

      <!-- Detected Signals -->
      <div>
        <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Why It Was Flagged</div>
        <div id="signals-list" class="flex flex-col gap-1.5"></div>
      </div>
    </section>
  </main>

  <footer class="px-4 py-2 border-b text-xs text-slate-400 flex items-center justify-between" style="border-bottom:none;border-top:1px solid var(--pg-border);">
    <span>Private · Never stores passwords</span>
    <button id="demo-btn" type="button" class="btn btn-ghost px-2 py-1 text-xs">Inbox Demo</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
